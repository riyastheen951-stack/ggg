    <button class="modal-close" onclick="closeModal('contact-modal')">✕</button>
    <div class="modal-title">📞 Seller Contact</div>
    <div style="background:var(--card);border-radius:10px;padding:20px">
      <div style="font-weight:600;margin-bottom:4px" id="modal-seller-name">Seller</div>
      <div style="color:var(--muted);font-size:0.85rem;margin-bottom:12px">BazaarX Verified Seller</div>
      <div style="font-size:1.1rem;font-weight:600;color:var(--accent)" id="modal-seller-phone">📱 +91 XXXXXXXXXX</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal('contact-modal')">Got it!</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// =============================================
// STATE
// =============================================
let users = JSON.parse(localStorage.getItem('bazaar_users') || '[]');
let products = JSON.parse(localStorage.getItem('bazaar_products') || '[]');
let currentUser = JSON.parse(localStorage.getItem('bazaar_current') || 'null');
let currentProductId = null;
let previousPage = 'page-home';
let activeCategory = 'All';
let selectedEmoji = '📱';

// Seed sample products if empty
if (products.length === 0) {
  products = [
    { id: 'p1', emoji: '📱', title: 'iPhone 14 Pro – 256GB', description: 'Barely used, 9/10 condition. All accessories included. No scratches.', price: 75000, category: 'Electronics', location: 'Mumbai, MH', seller: 'Demo Seller', sellerEmail: '__demo__', sellerPhone: '+91 9876543210', date: '2024-01-15', sold: false },
    { id: 'p2', emoji: '🚗', title: 'Honda City 2020 – Diesel', description: 'Single owner, 40,000 km. Well maintained. Insurance valid till 2025.', price: 850000, category: 'Vehicles', location: 'Delhi, DL', seller: 'Raj Motors', sellerEmail: '__demo__', sellerPhone: '+91 9812345678', date: '2024-01-14', sold: false },
    { id: 'p3', emoji: '💻', title: 'MacBook Air M2 – 8GB', description: 'Used for 6 months. Excellent condition. Comes with charger and box.', price: 95000, category: 'Electronics', location: 'Bangalore, KA', seller: 'TechDeals', sellerEmail: '__demo__', sellerPhone: '+91 9823456789', date: '2024-01-13', sold: false },
    { id: 'p4', emoji: '🛋️', title: 'L-Shaped Sofa Set', description: 'Premium fabric sofa, 2 years old. Color: Dark Grey. Very comfortable.', price: 22000, category: 'Home & Garden', location: 'Hyderabad, TG', seller: 'HomeStyle', sellerEmail: '__demo__', sellerPhone: '+91 9845678901', date: '2024-01-12', sold: false },
    { id: 'p5', emoji: '🎮', title: 'PlayStation 5 + 2 Controllers', description: 'PS5 Disc Edition. 3 months old. Includes 2 DualSense controllers. 5 games.', price: 48000, category: 'Electronics', location: 'Chennai, TN', seller: 'GameZone', sellerEmail: '__demo__', sellerPhone: '+91 9867890123', date: '2024-01-11', sold: false },
    { id: 'p6', emoji: '👟', title: 'Nike Air Jordan 1 – US 10', description: 'Original Nike Air Jordan 1 Retro. Worn twice. Comes with box.', price: 12000, category: 'Fashion', location: 'Pune, MH', seller: 'Sneaker Hub', sellerEmail: '__demo__', sellerPhone: '+91 9878901234', date: '2024-01-10', sold: false },
  ];
  saveProducts();
}

function saveUsers() { localStorage.setItem('bazaar_users', JSON.stringify(users)); }
function saveProducts() { localStorage.setItem('bazaar_products', JSON.stringify(products)); }
function saveCurrentUser() { localStorage.setItem('bazaar_current', JSON.stringify(currentUser)); }

// =============================================
// PAGES
// =============================================
function showPage(pageId) {
  if (pageId !== 'page-signup' && pageId !== 'page-login' && !currentUser) {
    showPage('page-login');
    return;
  }
  previousPage = document.querySelector('.page.active')?.id || 'page-home';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  window.scrollTo(0, 0);

  if (pageId === 'page-home') renderProducts();
  if (pageId === 'page-my-listings') renderMyListings();
  if (pageId === 'page-home' && currentUser) updateNavUser();
}

function goBack() { showPage(previousPage); }

function updateNavUser() {
  if (!currentUser) return;
  document.getElementById('nav-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
  document.getElementById('nav-username').textContent = currentUser.name.split(' ')[0];
}

// =============================================
// AUTH
// =============================================
function signup() {
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim().toLowerCase();
  const phone = document.getElementById('signup-phone').value.trim();
  const password = document.getElementById('signup-password').value;
  const errEl = document.getElementById('signup-error');

  if (!name || !email || !phone || !password) { showError(errEl, 'Please fill all fields.'); return; }
  if (password.length < 6) { showError(errEl, 'Password must be at least 6 characters.'); return; }
  if (users.find(u => u.email === email)) { showError(errEl, 'An account with this email already exists.'); return; }

  const user = { name, email, phone, password };
  users.push(user);
  saveUsers();
  currentUser = user;
  saveCurrentUser();
  errEl.style.display = 'none';
  showToast('🎉 Account created! Welcome, ' + name.split(' ')[0] + '!');
  updateNavUser();
  showPage('page-home');
}

function login() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');

  if (!email || !password) { showError(errEl, 'Please enter email and password.'); return; }
  const user = users.find(u => u.email === email && u.password === password);
  if (!user) { showError(errEl, 'Invalid email or password.'); return; }

  currentUser = user;
  saveCurrentUser();
  errEl.style.display = 'none';
  showToast('👋 Welcome back, ' + user.name.split(' ')[0] + '!');
  updateNavUser();
  showPage('page-home');
}

function logout() {
  currentUser = null;
  localStorage.removeItem('bazaar_current');
  showPage('page-login');
}

function showError(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}

// =============================================
// PRODUCTS
// =============================================
let currentFilter = 'All';
let searchQuery = '';

function filterByCategory(cat) {
  activeCategory = cat;
  currentFilter = cat;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.toggle('active', p.textContent.includes(cat) || (cat === 'All' && p.textContent.includes('All')));
  });
  document.getElementById('products-heading').textContent = cat === 'All' ? 'All Listings' : cat;
  renderProducts();
}

function filterProducts() {
  searchQuery = document.getElementById('search-input').value.toLowerCase();
  renderProducts();
}

function renderProducts() {
  let filtered = products.filter(p => !p.sold);
  if (currentFilter !== 'All') filtered = filtered.filter(p => p.category === currentFilter);
  if (searchQuery) filtered = filtered.filter(p =>
    p.title.toLowerCase().includes(searchQuery) ||
    p.description.toLowerCase().includes(searchQuery) ||
    p.category.toLowerCase().includes(searchQuery) ||
    p.location.toLowerCase().includes(searchQuery)
  );

  const grid = document.getElementById('products-grid');
  const empty = document.getElementById('empty-products');
  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
  } else {
    grid.style.display = 'grid';
    empty.style.display = 'none';
    filtered.forEach(p => grid.appendChild(createCard(p)));
  }
}

function createCard(p) {
  const card = document.createElement('div');
  card.className = 'product-card';
  card.onclick = () => openDetail(p.id);
  const isNew = (Date.now() - new Date(p.date).getTime()) < 7 * 24 * 60 * 60 * 1000;
  card.innerHTML = `
    <div class="product-img">
      <div class="product-img-emoji">${p.emoji}</div>
      ${isNew ? '<div class="product-badge">New</div>' : ''}
      <button class="wishlist-btn" onclick="event.stopPropagation();wishlistCard('${p.id}',this)">♡</button>
    </div>
    <div class="product-info">
      <div class="product-price">₹${Number(p.price).toLocaleString('en-IN')}</div>
      <div class="product-name">${p.title}</div>
      <div class="product-meta">
        <span>📍 ${p.location}</span>
        <span>${p.category}</span>
      </div>
      <div class="product-seller">by ${p.seller}</div>
    </div>`;
  return card;
}

function openDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProductId = id;
  document.getElementById('detail-img').textContent = p.emoji;
  document.getElementById('detail-price').textContent = '₹' + Number(p.price).toLocaleString('en-IN');
  document.getElementById('detail-name').textContent = p.title;
  document.getElementById('detail-category').textContent = p.category;
  document.getElementById('detail-location').textContent = '📍 ' + p.location;
  document.getElementById('detail-date').textContent = '🕐 ' + p.date;
  document.getElementById('detail-desc').textContent = p.description;
  document.getElementById('detail-seller-name').textContent = p.seller;
  document.getElementById('detail-seller-avatar').textContent = p.seller.charAt(0).toUpperCase();

  const isOwn = currentUser && p.sellerEmail === currentUser.email;
  document.getElementById('detail-actions').style.display = isOwn ? 'none' : 'flex';
  document.getElementById('own-listing-notice').style.display = isOwn ? 'block' : 'none';

  showPage('page-detail');
}

// =============================================
// SELL
// =============================================
function selectEmoji(el) {
  document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedEmoji = el.dataset.emoji;
}

function postProduct() {
  const title = document.getElementById('sell-title').value.trim();
  const desc = document.getElementById('sell-desc').value.trim();
  const category = document.getElementById('sell-category').value;
  const price = document.getElementById('sell-price').value;
  const location = document.getElementById('sell-location').value.trim();

  if (!title || !desc || !price || !location) { showToast('⚠️ Please fill all fields', true); return; }
  if (Number(price) <= 0) { showToast('⚠️ Enter a valid price', true); return; }

  const product = {
    id: 'p' + Date.now(),
    emoji: selectedEmoji,
    title,
    description: desc,
    price: Number(price),
    category,
    location,
    seller: currentUser.name,
    sellerEmail: currentUser.email,
    sellerPhone: currentUser.phone,
    date: new Date().toISOString().split('T')[0],
    sold: false
  };

  products.unshift(product);
  saveProducts();

  // Reset form
  document.getElementById('sell-title').value = '';
  document.getElementById('sell-desc').value = '';
  document.getElementById('sell-price').value = '';
  document.getElementById('sell-location').value = '';

  showToast('🎉 Your ad is live!');
  showPage('page-home');
}

// =============================================
// MY LISTINGS
// =============================================
function renderMyListings() {
  if (!currentUser) return;
  const myProducts = products.filter(p => p.sellerEmail === currentUser.email);
  const grid = document.getElementById('my-products-grid');
  const empty = document.getElementById('my-empty');
  const sub = document.getElementById('my-listings-sub');

  sub.textContent = myProducts.length + ' listing' + (myProducts.length === 1 ? '' : 's');
  grid.innerHTML = '';

  if (myProducts.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
  } else {
    grid.style.display = 'grid';
    empty.style.display = 'none';
    myProducts.forEach(p => {
      const card = createCard(p);
      // Add delete overlay
      const del = document.createElement('button');
      del.className = 'btn btn-danger btn-sm';
      del.style.cssText = 'position:absolute;bottom:12px;right:12px;z-index:2';
      del.textContent = '🗑 Delete';
      del.onclick = (e) => { e.stopPropagation(); deleteProduct(p.id); };
      card.style.position = 'relative';
      card.appendChild(del);
      grid.appendChild(card);
    });
  }
}

function deleteProduct(id) {
  products = products.filter(p => p.id !== id);
  saveProducts();
  renderMyListings();
  showToast('🗑️ Listing deleted');
}

function deleteCurrentProduct() {
  deleteProduct(currentProductId);
  showPage('page-home');
}

// =============================================
// BUY / WISHLIST
// =============================================
function buyProduct() {
  const p = products.find(x => x.id === currentProductId);
  if (!p) return;
  document.getElementById('modal-product-name').textContent = p.title;
  document.getElementById('modal-product-price').textContent = '₹' + Number(p.price).toLocaleString('en-IN');
  document.getElementById('buy-modal').classList.add('open');
}

function confirmPurchase() {
  const address = document.getElementById('buy-address').value.trim();
  if (!address) { showToast('⚠️ Please enter a delivery address', true); return; }
  products = products.map(p => p.id === currentProductId ? { ...p, sold: true } : p);
  saveProducts();
  closeModal('buy-modal');
  showToast('✅ Order placed successfully!');
  setTimeout(() => showPage('page-home'), 1200);
}

function showContact() {
  const p = products.find(x => x.id === currentProductId);
  if (!p) return;
  document.getElementById('modal-seller-name').textContent = p.seller;
  document.getElementById('modal-seller-phone').textContent = '📱 ' + (p.sellerPhone || '+91 XXXXXXXXXX');
  document.getElementById('contact-modal').classList.add('open');
}

function wishlistProduct() {
  showToast('❤️ Added to wishlist!');
  document.getElementById('wishlist-action-btn').textContent = '❤️ Wishlisted';
}

function wishlistCard(id, btn) {
  btn.textContent = '♥';
  btn.style.color = 'var(--danger)';
  showToast('❤️ Added to wishlist!');
}

// =============================================
// MODAL / TOAST
// =============================================
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

let toastTimer;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// =============================================
// INIT
// =============================================
window.addEventListener('load', () => {
  if (currentUser) {
    updateNavUser();
    showPage('page-home');
  }
});
</script>
