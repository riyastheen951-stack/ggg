<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BazaarX – Buy & Sell Anything</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --card: #222120;
    --border: #2e2c29;
    --accent: #f5c842;
    --accent2: #ff6b35;
    --text: #f0ece4;
    --muted: #8a8478;
    --success: #4ade80;
    --danger: #f87171;
    --radius: 14px;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* PAGES */
  .page { display: none; min-height: 100vh; }
  .page.active { display: block; }

  /* ===== AUTH PAGES ===== */
  .auth-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }
  .auth-brand {
    background: linear-gradient(135deg, #1a1200 0%, #2d2000 40%, #1a0a00 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }
  .auth-brand::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,200,66,0.15) 0%, transparent 70%);
    top: -100px; left: -100px;
  }
  .auth-brand::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,53,0.12) 0%, transparent 70%);
    bottom: -50px; right: -50px;
  }
  .brand-logo {
    font-family: var(--font-head);
    font-size: 3rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -2px;
    margin-bottom: 12px;
    position: relative; z-index: 1;
  }
  .brand-logo span { color: var(--accent2); }
  .brand-tagline {
    font-size: 1.15rem;
    color: var(--muted);
    line-height: 1.6;
    max-width: 320px;
    position: relative; z-index: 1;
  }
  .brand-stats {
    display: flex;
    gap: 32px;
    margin-top: 60px;
    position: relative; z-index: 1;
  }
  .stat-item { text-align: left; }
  .stat-num {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
  }
  .stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .auth-form-panel {
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
  }
  .auth-form-box {
    width: 100%;
    max-width: 400px;
  }
  .auth-title {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .auth-sub { color: var(--muted); margin-bottom: 36px; font-size: 0.95rem; }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,200,66,0.1);
  }
  .form-group textarea { min-height: 100px; resize: vertical; }
  .form-group select option { background: var(--card); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    border: none;
    border-radius: 10px;
    font-family: var(--font-head);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--accent);
    color: #0f0e0c;
    width: 100%;
  }
  .btn-primary:hover { background: #ffd44a; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(245,200,66,0.3); }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
  .btn-accent2 { background: var(--accent2); color: #fff; }
  .btn-accent2:hover { background: #ff8255; transform: translateY(-1px); }

  .auth-switch {
    text-align: center;
    margin-top: 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .auth-switch a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
  }
  .auth-switch a:hover { text-decoration: underline; }

  .error-msg {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--danger);
    font-size: 0.88rem;
    margin-bottom: 16px;
    display: none;
  }

  /* ===== NAVBAR ===== */
  .navbar {
    background: rgba(15,14,12,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 0 40px;
    display: flex;
    align-items: center;
    height: 64px;
    gap: 24px;
  }
  .nav-logo {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -1px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .nav-logo span { color: var(--accent2); }
  .nav-search {
    flex: 1;
    max-width: 460px;
    position: relative;
  }
  .nav-search input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 10px 20px 10px 44px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .nav-search input:focus { border-color: var(--accent); }
  .nav-search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1rem;
  }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .nav-user {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .nav-avatar {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-weight: 700;
    color: #0f0e0c;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  /* ===== HOME PAGE ===== */
  .hero {
    background: linear-gradient(180deg, #1a1400 0%, var(--bg) 100%);
    padding: 60px 40px 40px;
    text-align: center;
  }
  .hero h1 {
    font-family: var(--font-head);
    font-size: 3.5rem;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }
  .hero h1 em { color: var(--accent); font-style: normal; }
  .hero p { color: var(--muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto 32px; }

  .category-pills {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 40px 0;
    margin-bottom: 40px;
    scrollbar-width: none;
  }
  .category-pills::-webkit-scrollbar { display: none; }
  .pill {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .pill:hover, .pill.active { background: var(--accent); border-color: var(--accent); color: #0f0e0c; font-weight: 600; }

  .section { padding: 0 40px 60px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .section-title {
    font-family: var(--font-head);
    font-size: 1.4rem;
    font-weight: 700;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  .product-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }
  .product-card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .product-img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    position: relative;
    overflow: hidden;
  }
  .product-img-emoji { font-size: 4rem; }
  .product-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--accent);
    color: #0f0e0c;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 50px;
    font-family: var(--font-head);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .product-info { padding: 16px; }
  .product-price {
    font-family: var(--font-head);
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .product-name {
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.78rem;
  }
  .product-seller { color: var(--muted); font-size: 0.78rem; }

  .wishlist-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(15,14,12,0.8);
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    color: var(--muted);
    transition: all 0.2s;
  }
  .wishlist-btn:hover { color: var(--danger); background: rgba(15,14,12,0.95); }
  .wishlist-btn.active { color: var(--danger); }

  /* ===== SELL PAGE ===== */
  .sell-wrap { max-width: 720px; margin: 0 auto; padding: 40px; }
  .sell-title {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .sell-sub { color: var(--muted); margin-bottom: 36px; }

  .sell-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 20px;
  }
  .sell-card-title {
    font-family: var(--font-head);
    font-weight: 700;
    margin-bottom: 20px;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .emoji-picker {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .emoji-option {
    width: 56px; height: 56px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .emoji-option:hover, .emoji-option.selected { border-color: var(--accent); background: rgba(245,200,66,0.1); }

  .price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* ===== PRODUCT DETAIL ===== */
  .detail-wrap { max-width: 1000px; margin: 0 auto; padding: 40px; }
  .detail-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; }
  .detail-img {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7rem;
  }
  .detail-info {}
  .detail-price {
    font-family: var(--font-head);
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .detail-name {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .detail-desc { color: var(--muted); line-height: 1.7; margin-bottom: 24px; }
  .detail-seller-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .seller-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .seller-avatar {
    width: 48px; height: 48px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-weight: 700;
    color: #0f0e0c;
    font-size: 1.1rem;
  }
  .seller-name { font-weight: 600; font-size: 1rem; }
  .seller-label { font-size: 0.8rem; color: var(--muted); }

  .tag { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; color: var(--muted); margin: 2px; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    margin-bottom: 24px;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--text); }

  /* ===== MY LISTINGS ===== */
  .my-wrap { max-width: 900px; margin: 0 auto; padding: 40px; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--success);
    color: #0f0e0c;
    padding: 14px 22px;
    border-radius: 10px;
    font-weight: 600;
    font-family: var(--font-head);
    z-index: 9999;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    font-size: 0.9rem;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { background: var(--danger); color: #fff; }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    width: 90%;
    max-width: 440px;
    position: relative;
  }
  .modal-title {
    font-family: var(--font-head);
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 20px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
  }
  .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
  .modal-actions .btn { flex: 1; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 4rem; margin-bottom: 16px; }
  .empty-title { font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }

  /* Responsive */
  @media (max-width: 768px) {
    .auth-wrap { grid-template-columns: 1fr; }
    .auth-brand { display: none; }
    .navbar { padding: 0 16px; }
    .hero { padding: 40px 16px 24px; }
    .hero h1 { font-size: 2rem; }
    .section { padding: 0 16px 40px; }
    .detail-grid { grid-template-columns: 1fr; }
    .sell-wrap, .detail-wrap, .my-wrap { padding: 20px 16px; }
    .sell-card { padding: 20px; }
  }
</style>
</head>
<body>

<!-- ===== SIGNUP PAGE ===== -->
<div id="page-signup" class="page active">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-logo">Bazaar<span>X</span></div>
      <p class="brand-tagline">Buy and sell anything. From electronics to fashion — your local marketplace awaits.</p>
      <div class="brand-stats">
        <div class="stat-item">
          <div class="stat-num">50K+</div>
          <div class="stat-label">Listings</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">12K+</div>
          <div class="stat-label">Sellers</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">Free</div>
          <div class="stat-label">To Post</div>
        </div>
      </div>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-box">
        <div class="auth-title">Create Account</div>
        <div class="auth-sub">Join BazaarX and start buying or selling today</div>
        <div class="error-msg" id="signup-error"></div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="signup-phone" placeholder="+91 9876543210">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Min. 6 characters">
        </div>
        <button class="btn btn-primary" onclick="signup()">Create Account</button>
        <div class="auth-switch">Already have an account? <a onclick="showPage('page-login')">Log in</a></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== LOGIN PAGE ===== -->
<div id="page-login" class="page">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-logo">Bazaar<span>X</span></div>
      <p class="brand-tagline">Welcome back! Thousands of great deals are waiting for you.</p>
      <div class="brand-stats">
        <div class="stat-item">
          <div class="stat-num">50K+</div>
          <div class="stat-label">Listings</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">12K+</div>
          <div class="stat-label">Sellers</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">Free</div>
          <div class="stat-label">To Post</div>
        </div>
      </div>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-box">
        <div class="auth-title">Welcome Back</div>
        <div class="auth-sub">Log in to continue to BazaarX</div>
        <div class="error-msg" id="login-error"></div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Your password">
        </div>
        <button class="btn btn-primary" onclick="login()">Log In</button>
        <div class="auth-switch">Don't have an account? <a onclick="showPage('page-signup')">Sign up</a></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== HOME PAGE ===== -->
<div id="page-home" class="page">
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo" onclick="showPage('page-home')">Bazaar<span>X</span></div>
    <div class="nav-search">
      <span class="nav-search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search for anything..." oninput="filterProducts()">
    </div>
    <div class="nav-actions">
      <div class="nav-user">
        <div class="nav-avatar" id="nav-avatar">?</div>
        <span id="nav-username" style="color:var(--text)"></span>
      </div>
      <button class="btn btn-sm btn-secondary" onclick="showPage('page-my-listings')">My Listings</button>
      <button class="btn btn-sm btn-accent2" onclick="showPage('page-sell')">+ Sell</button>
      <button class="btn btn-sm btn-secondary" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <h1>Buy & Sell <em>Anything</em><br>Near You</h1>
